<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>

  <h1>FITNESS MANAGER</h1>
  <nav><a href="index.html">Painel</a><a href="cadastro.html">Matrículas</a><a href="planos.html">Planos</a></nav>

</header>

<main>
  <h2>Nova matrícula</h2>
  <p class="sub"><strong>Dados do aluno</strong></p>

  <form action="processar.php" method="post">

    <div class="grid2">
      <div><label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Maria Oliveira" required></div>

      <div><label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(41) 99999-9999" required></div>

      <div><label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="maria@exemplo.com" required></div>

      <div><label for="idade">Idade</label>
        <input type="number" id="idade" name="idade" min="0" placeholder="18 ou mais" required></div>

      <div><label for="data">Data da matrícula</label>
        <input type="date" id="data" name="data" required></div>

      <div><label for="plano">Plano</label>

        <select id="plano" name="plano" required>
          <option value="">Selecione</option>

          <option value="basico">Básico - R$ 89,90</option>

          <option value="plus">Plus - R$ 129,90</option>

          <option value="premium">Premium - R$ 179,90</option>

        </select></div>

      <div><label for="pagamento">Pagamento</label>

        <select id="pagamento" name="pagamento" required>
          <option value="">Selecione</option>

          <option value="pix">PIX</option>

          <option value="cartao">Cartão</option>

        </select></div>
    </div>

    <button class="btn" type="submit">Confirmar matrícula</button>

  </form>

</main>

</body>
</html>
